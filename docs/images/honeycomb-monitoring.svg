<path d="M324.15,340.0 H364.08" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M428.08,340.0 H468.00" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="610" font-size="18" font-weight="bold" fill="#c2410c">Example: W2 fades first, then W1. Raise the cost at C before an outage.</text>
<text x="500" y="644" font-size="14" fill="#475569">1 = inner site; 2 = farther site on the same direction. Other directions use the same logic.</text>
<text x="500" y="673" font-size="14" fill="#475569">Cells show a proposed monitoring pattern, not actual gateway positions or radio paths.</text>
<text x="500" y="702" font-size="14" fill="#475569">19 cells illustrate two complete rings. The final number of sites is still to be designed.</text>
