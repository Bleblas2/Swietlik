<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Honeycomb monitoring layout with two rings around a central gateway</title>
<desc id="desc">Nineteen adjoining hexagonal cells: one central site, six inner sites and twelve outer positions. The example warning sequence is W2 then W1 then central gateway C.</desc>
